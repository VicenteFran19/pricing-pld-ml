name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar data sintética
        run: python src/generar_data_sintetica.py

      - name: Entrenar modelo de riesgo
        run: python src/modelo_riesgo.py

      - name: Entrenar modelo de elasticidad
        run: python src/modelo_elasticidad.py

      - name: Correr tests
        run: pytest tests/ -v
